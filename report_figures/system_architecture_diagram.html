<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battery Health System Architecture</title>
    <style>
      :root {
        --ink: #18212b;
        --muted: #51606d;
        --teal: #0b8f92;
        --blue: #1f6fbf;
        --green: #2f7d32;
        --amber: #d9891f;
        --violet: #6d5aa7;
        --red: #c53b3f;
        --line: #78909c;
        --panel: #f7fafc;
        --border: #cbd8e1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #eef4f6;
      }

      .diagram-frame {
        width: min(1680px, calc(100vw - 48px));
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 42px rgba(24, 33, 43, 0.14);
      }

      svg {
        display: block;
        width: 1680px;
        height: 780px;
      }

      text {
        fill: var(--ink);
        letter-spacing: 0;
      }

      .label-title {
        font-size: 22px;
        font-weight: 800;
      }

      .label-sub {
        fill: var(--muted);
        font-size: 15px;
        font-weight: 650;
      }

      .small {
        fill: var(--muted);
        font-size: 13px;
        font-weight: 750;
      }

      .tiny {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 750;
      }

      .box-title {
        fill: #ffffff;
        font-size: 17px;
        font-weight: 850;
      }

      .box-sub {
        fill: rgba(255, 255, 255, 0.9);
        font-size: 13px;
        font-weight: 650;
      }

      .stroke {
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .arrow {
        fill: none;
        stroke: var(--line);
        stroke-width: 3.2;
        stroke-linecap: round;
      }

      .guide {
        stroke: rgba(120, 144, 156, 0.2);
        stroke-width: 1.4;
        stroke-dasharray: 7 9;
      }
    </style>
  </head>
  <body>
    <main class="diagram-frame" aria-label="Battery health system architecture diagram">
      <svg viewBox="0 0 1680 780" role="img" aria-labelledby="diagram-title diagram-desc">
        <title id="diagram-title">Battery health system architecture</title>
        <desc id="diagram-desc">A left-to-right system diagram from aircraft telemetry through data cleaning, latent SOH estimation, short-term and long-term forecasting, and operational planning.</desc>

        <defs>
          <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Z" fill="var(--teal)"></path>
          </marker>
          <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Z" fill="var(--blue)"></path>
          </marker>
          <marker id="arrow-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Z" fill="var(--green)"></path>
          </marker>
          <marker id="arrow-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Z" fill="var(--amber)"></path>
          </marker>
          <marker id="arrow-violet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto">
            <path d="M 1 1 L 11 6 L 1 11 Z" fill="var(--violet)"></path>
          </marker>
        </defs>

        <rect x="0" y="0" width="1680" height="780" fill="#ffffff"></rect>
        <rect x="32" y="32" width="1616" height="664" rx="8" fill="#fbfdfe" stroke="var(--border)"></rect>
        <line class="guide" x1="76" y1="285" x2="1604" y2="285"></line>
        <line class="guide" x1="870" y1="170" x2="1604" y2="170"></line>
        <line class="guide" x1="870" y1="408" x2="1604" y2="408"></line>

        <!-- Straight process arrows -->
        <line class="arrow" x1="215" y1="285" x2="330" y2="285" stroke="var(--teal)" marker-end="url(#arrow-teal)"></line>
        <line class="arrow" x1="520" y1="285" x2="645" y2="285" stroke="var(--blue)" marker-end="url(#arrow-blue)"></line>
        <line class="arrow" x1="805" y1="170" x2="930" y2="170" stroke="var(--green)" marker-end="url(#arrow-green)"></line>
        <line class="arrow" x1="805" y1="408" x2="930" y2="408" stroke="var(--green)" marker-end="url(#arrow-green)"></line>
        <line class="arrow" x1="1118" y1="170" x2="1270" y2="170" stroke="var(--amber)" marker-end="url(#arrow-amber)"></line>
        <line class="arrow" x1="1118" y1="408" x2="1270" y2="408" stroke="var(--violet)" marker-end="url(#arrow-violet)"></line>

        <!-- Aircraft telemetry visual -->
        <g transform="translate(82 168)" stroke="var(--teal)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
          <path d="M 0 112 L 190 48 L 142 112 L 190 176 Z"></path>
          <path d="M 142 112 H 56 L 22 70"></path>
          <path d="M 56 112 L 22 154"></path>
          <path d="M 96 100 L 124 58"></path>
          <path d="M 96 124 L 124 166"></path>
          <path d="M 204 96 H 240" opacity="0.45"></path>
          <path d="M 204 128 H 240" opacity="0.45"></path>
        </g>

        <!-- Cleaning visual -->
        <g transform="translate(345 118)">
          <rect x="0" y="0" width="170" height="250" rx="8" fill="#eaf4fb" stroke="#9cc6e4"></rect>
          <g stroke="var(--blue)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.88">
            <line x1="34" y1="54" x2="86" y2="54"></line>
            <line x1="34" y1="96" x2="86" y2="96"></line>
            <line x1="34" y1="138" x2="86" y2="138"></line>
            <circle cx="50" cy="54" r="5" fill="var(--blue)" stroke="none"></circle>
            <circle cx="72" cy="96" r="5" fill="var(--blue)" stroke="none"></circle>
            <circle cx="58" cy="138" r="5" fill="var(--blue)" stroke="none"></circle>
            <path d="M 104 42 H 152 L 132 92 V 168 L 119 178 V 92 Z" stroke-width="5"></path>
            <path d="M 128 202 L 142 216 L 166 184"></path>
          </g>
        </g>

        <!-- Latent SOH visual -->
        <g transform="translate(645 134)">
          <rect x="0" y="0" width="190" height="220" rx="8" fill="#edf8f0" stroke="#a9d4ad"></rect>
          <g stroke="var(--green)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="24" y1="172" x2="166" y2="172" stroke="#bdd8c0" stroke-width="2"></line>
            <line x1="24" y1="36" x2="24" y2="172" stroke="#bdd8c0" stroke-width="2"></line>
            <g fill="var(--green)" stroke="none" opacity="0.7">
              <circle cx="44" cy="58" r="5"></circle>
              <circle cx="64" cy="118" r="5"></circle>
              <circle cx="84" cy="82" r="5"></circle>
              <circle cx="104" cy="134" r="5"></circle>
              <circle cx="126" cy="116" r="5"></circle>
              <circle cx="148" cy="146" r="5"></circle>
            </g>
            <path d="M 40 82 C 68 92, 92 104, 116 118 C 136 130, 148 138, 164 148" stroke-width="6"></path>
            <path d="M 38 42 H 98" stroke="#8ab990" stroke-width="3" opacity="0.55"></path>
            <path d="M 38 196 H 150" stroke="#8ab990" stroke-width="3" opacity="0.55"></path>
          </g>
        </g>

        <!-- Short-term forecast visual -->
        <g transform="translate(930 70)">
          <rect x="0" y="0" width="190" height="170" rx="8" fill="#fff8ec" stroke="#e4bd7b"></rect>
          <g stroke="var(--amber)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="24" y1="132" x2="166" y2="132" stroke="#e6d1ad" stroke-width="2"></line>
            <line x1="24" y1="38" x2="24" y2="132" stroke="#e6d1ad" stroke-width="2"></line>
            <path d="M 36 64 L 58 72 L 78 66 L 100 84 L 122 92 L 150 110" stroke-width="5"></path>
            <path d="M 100 84 C 120 76, 138 78, 160 88" stroke-width="3" stroke-dasharray="7 7"></path>
            <circle cx="100" cy="84" r="6" fill="var(--amber)" stroke="none"></circle>
          </g>
        </g>

        <!-- Long-term forecast visual -->
        <g transform="translate(930 312)">
          <rect x="0" y="0" width="190" height="170" rx="8" fill="#f4f1fb" stroke="#b9adda"></rect>
          <g stroke="var(--violet)" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="24" y1="132" x2="166" y2="132" stroke="#cac2e5" stroke-width="2"></line>
            <line x1="24" y1="36" x2="24" y2="132" stroke="#cac2e5" stroke-width="2"></line>
            <path d="M 34 52 C 72 54, 104 82, 130 104 C 146 118, 156 124, 166 128" stroke-width="6"></path>
            <path d="M 38 92 H 78" stroke-width="3" opacity="0.45"></path>
            <path d="M 98 102 H 144" stroke-width="3" opacity="0.45"></path>
            <circle cx="128" cy="104" r="6" fill="var(--violet)" stroke="none"></circle>
          </g>
        </g>

        <!-- Operational planning visual -->
        <g transform="translate(1280 112)">
          <rect x="0" y="0" width="240" height="360" rx="8" fill="#fff4f4" stroke="#dfa1a4"></rect>
          <g stroke="var(--red)" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
            <path d="M 54 126 C 82 70, 158 70, 186 126"></path>
            <path d="M 120 126 L 156 78"></path>
            <path d="M 62 132 H 178"></path>
            <rect x="42" y="176" width="64" height="54" rx="6"></rect>
            <path d="M 54 164 V 188"></path>
            <path d="M 94 164 V 188"></path>
            <path d="M 42 196 H 106"></path>
            <path d="M 138 222 L 164 196 L 182 210 L 210 172"></path>
            <path d="M 134 242 H 210"></path>
          </g>
          <g fill="var(--red)" opacity="0.2">
            <circle cx="56" cy="284" r="12"></circle>
            <circle cx="94" cy="284" r="12"></circle>
            <circle cx="132" cy="284" r="12"></circle>
            <circle cx="170" cy="284" r="12"></circle>
          </g>
        </g>

        <!-- Bottom text squares -->
        <g transform="translate(56 560)">
          <rect x="0" y="0" width="220" height="92" rx="4" fill="var(--teal)"></rect>
          <text class="box-title" x="110" y="34" text-anchor="middle">Aircraft</text>
          <text class="box-title" x="110" y="56" text-anchor="middle">telemetry</text>
          <text class="box-sub" x="110" y="78" text-anchor="middle">Battery / SOC / temp</text>
        </g>
        <g transform="translate(330 560)">
          <rect x="0" y="0" width="220" height="92" rx="4" fill="var(--blue)"></rect>
          <text class="box-title" x="110" y="34" text-anchor="middle">Data</text>
          <text class="box-title" x="110" y="56" text-anchor="middle">cleaning</text>
          <text class="box-sub" x="110" y="78" text-anchor="middle">Ingest / filter / correct</text>
        </g>
        <g transform="translate(610 560)">
          <rect x="0" y="0" width="220" height="92" rx="4" fill="var(--green)"></rect>
          <text class="box-title" x="110" y="34" text-anchor="middle">SOH</text>
          <text class="box-title" x="110" y="56" text-anchor="middle">estimation</text>
          <text class="box-sub" x="110" y="78" text-anchor="middle">Kalman latent smoothing</text>
        </g>
        <g transform="translate(895 560)">
          <rect x="0" y="0" width="260" height="92" rx="4" fill="#7b679d"></rect>
          <text class="box-title" x="130" y="30" text-anchor="middle">Forecasting</text>
          <text class="box-sub" x="130" y="54" text-anchor="middle">Short-term time series</text>
          <text class="box-sub" x="130" y="74" text-anchor="middle">Long-term backbone</text>
        </g>
        <g transform="translate(1260 560)">
          <rect x="0" y="0" width="260" height="92" rx="4" fill="var(--red)"></rect>
          <text class="box-title" x="130" y="34" text-anchor="middle">Operational</text>
          <text class="box-title" x="130" y="56" text-anchor="middle">planning</text>
          <text class="box-sub" x="130" y="78" text-anchor="middle">Circuits / schedule / advice</text>
        </g>
      </svg>
    </main>
  </body>
</html>
